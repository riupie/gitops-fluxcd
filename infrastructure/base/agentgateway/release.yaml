---
# CRDs ship in their own chart so they are upgraded independently of the controller.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: agentgateway-system
spec:
  interval: 1h
  releaseName: agentgateway-crds
  chart:
    spec:
      chart: agentgateway-crds
      version: "v1.6.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  interval: 1h
  releaseName: agentgateway
  dependsOn:
    - name: agentgateway-crds
  chart:
    spec:
      chart: agentgateway
      version: "v1.6.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
