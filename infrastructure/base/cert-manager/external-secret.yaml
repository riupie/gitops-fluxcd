---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-key
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-secret-store
  target:
    name: cloudflare-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: cloudflare-api-key
