---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 1h
  releaseName: sealed-secrets
  chart:
    spec:
      chart: sealed-secrets
      version: "2.20.0"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: sealed-secrets-controller
