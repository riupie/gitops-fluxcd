---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-bind9-tsig-key
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-secret-store
  target:
    name: external-dns-bind9-tsig-key
    creationPolicy: Owner
  data:
    - secretKey: ddns-key
      remoteRef:
        key: /external-dns/EXTERNAL_DNS_TSIG_KEY
