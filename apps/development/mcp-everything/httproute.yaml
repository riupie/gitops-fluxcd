---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-everything
  namespace: mcp-server
spec:
  parentRefs:
    - name: gateway-ai
      namespace: gateway-system
      sectionName: https
  hostnames:
    - gateway.lab.riupie.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/everything
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp/everything
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/everything
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend
