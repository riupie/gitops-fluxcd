---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-backend
  namespace: mcp-server
spec:
  mcp:
    targets:
      - name: mcp-target
        static:
          backendRef:
            name: mcp-everything
          port: 80
          protocol: StreamableHTTP
          path: /mcp
