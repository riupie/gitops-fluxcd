---
# Require a valid Keycloak (mcp realm) access token for the MCP route.
# Keycloak side: scope `mcp-web-fetcher` (audience mapper) + scope `mcp` (groups mapper).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-website-fetcher-jwt
  namespace: mcp-server
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-website-fetcher
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://keycloak.lab.riupie.com/realms/mcp
          audiences:
            - https://gateway.lab.riupie.com/mcp/web-fetcher
          jwks:
            remote:
              url: https://keycloak.lab.riupie.com/realms/mcp/protocol/openid-connect/certs
      mcp:
        provider: Keycloak
        resourceMetadata:
          resource: https://gateway.lab.riupie.com/mcp/web-fetcher
          authorizationServers:
            - https://keycloak.lab.riupie.com/realms/mcp
          scopesSupported:
            - openid
            - mcp
            - mcp-web-fetcher
          bearerMethodsSupported:
            - header
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'has(jwt.groups) && jwt.groups.exists(group, group == "users")'
